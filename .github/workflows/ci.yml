name: SANRO Hermes Starter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python stdlib tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q sanro_hermes tests
      - name: Offline tests (no credentials)
        run: python -m unittest discover -s tests -v
